[project]
name = "glyphweave"
version = "0.1.0"
description = "Privacy-focused, local-first document management with zero-knowledge cloud storage"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Shameel" }]
# PEP 639 ``license`` is the canonical source - don't duplicate the legacy
# "License :: OSI Approved :: ..." classifier here.
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cryptography>=46.0.4",
    "kreuzberg==4.7.4",
    "mfusepy>=3.1.0",
    "mnemonic>=0.21",
    "sqlalchemy>=2.0.46",
    "sqlcipher3-wheels>=0.5.7",
    "watchdog>=6.0.0",
    "PySide6>=6.10.2"
]

[project.scripts]
glyphweave = "app.glyphweave:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "lizard>=1.22.1",
    "mypy>=1.20.2",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.9",
    "vulture>=2.16",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/**", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false

[tool.ruff]
include = ["app/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
show_error_codes = true
ignore_errors = false

[[tool.mypy.overrides]]
module = "app.ui.gui.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.infrastructure.crypto.primitives.secure_memory"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.infrastructure.fuse.chunk_store.types"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "app.infrastructure.fuse.meta_store"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "app.infrastructure.crypto.service.key_service"
follow_imports = "skip"
